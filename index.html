<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ❤️ | A Senior Dev's Love Card</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Background Floating Elements -->
    <div id="bg-particles"></div>

    <div class="card">
        <div class="card-inner">
            
            <!-- Photo Carousel Section -->
            <div class="slider-wrapper">
                <div class="slider-container">
                    <img src="photo1.jpg" alt="Memory 1" class="card-img active">
                    <img src="photo2.jpg" alt="Memory 2" class="card-img">
                    <img src="photo3.jpg" alt="Memory 3" class="card-img">
                    <img src="photo4.jpg" alt="Memory 4" class="card-img">
                    <img src="photo5.jpg" alt="Memory 5" class="card-img">
                </div>
                <!-- Navigation Dots -->
                <div class="slider-dots" id="sliderDots"></div>
            </div>

            <!-- Text & Poetry Section -->
            <div class="text-content">
                <h1>My Dearest</h1>
                <div class="poetry-container">
                    <p id="poetry-text" class="poetry"></p>
                    <span class="cursor">|</span>
                </div>
            </div>
            
            <!-- Interactive Action -->
            <button id="loveBtn" class="love-button">
                <span class="heart-icon">❤</span> Send Love
            </button>
        </div>
        
        <!-- Heart Burst Container -->
        <div id="hearts-container"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
